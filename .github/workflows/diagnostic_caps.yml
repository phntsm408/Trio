name: Diagnostic - Check Identifier Capabilities
on: workflow_dispatch
env:
  TEAMID: ${{ secrets.TEAMID }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
jobs:
  check:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install deps
        run: bundle install
      - name: Query capabilities
        run: |
          cat > query_caps.rb << 'RUBY'
          require "spaceship"
          client = Spaceship::ConnectAPI.auth(
            key_id: ENV["FASTLANE_KEY_ID"],
            issuer_id: ENV["FASTLANE_ISSUER_ID"],
            key: ENV["FASTLANE_KEY"]
          )
          ["", ".watchkitapp", ".watchkitapp.TrioWatchComplication", ".LiveActivity"].each do |suffix|
            identifier = "org.nightscout." + ENV["TEAMID"] + ".trio" + suffix
            puts "--- " + identifier + " ---"
            begin
              bids = client.get_bundle_ids(filter: { identifier: identifier })
              bid = bids.first
              if bid
                caps = bid.get_capabilities(client: client).map { |c| c.capability_type }
                puts "  capabilities: " + caps.inspect
                settings = bid.get_capabilities(client: client).map { |c| c.settings }
                puts "  settings: " + settings.inspect
              else
                puts "  IDENTIFIER NOT FOUND"
              end
            rescue => e
              puts "  error: " + e.message
            end
          end
          RUBY
          bundle exec ruby query_caps.rb
