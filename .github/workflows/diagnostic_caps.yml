name: Diagnostic - Check Identifier Capabilities
on: workflow_dispatch
env:
  TEAMID: ${{ secrets.TEAMID }}
  FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
  FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
  FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
jobs:
  check:
    runs-on: macos-26
    steps:
      - name: Query capabilities
        run: |
          ruby -e '
            require "openssl"
            require "json"
            require "base64"
            key = ENV["FASTLANE_KEY"].strip
            now = Time.now.to_i
            h = Base64.urlsafe_encode64(JSON.generate({alg: "HS256", kid: ENV["FASTLANE_KEY_ID"]}), padding: false)
            p = Base64.urlsafe_encode64(JSON.generate({iss: ENV["FASTLANE_ISSUER_ID"], iat: now, exp: now + 600}), padding: false)
            sig = Base64.urlsafe_encode64(OpenSSL::HMAC.digest("SHA256", key, h + "." + p), padding: false)
            jwt = h + "." + p + "." + sig
            resp = `curl -s -H "Authorization: Bearer #{jwt}" "https://api.appstoreconnect.apple.com/v1/bundleIds?limit=20"`
            data = JSON.parse(resp)
            if data["data"].nil?
              puts "API error: #{resp[0,400]}"
            else
              data["data"].each do |b|
                a = b["attributes"]
                puts "--- #{a["identifier"]} ---"
                puts "  capabilities: #{a["capabilities"].inspect}"
                puts "  app groups: #{a["groups"].inspect}"
              end
            end
          '
